[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "itg_nn"
version = "0.1.0"
description = "Inference-only cyclic neural-network ensemble for GX ITG heat flux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.8",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
# Keep interpretation packages optional: ordinary inference should retain its
# small, validated runtime dependency set. Later PLAN.md steps add their own
# pins here after a compatibility smoke test; see requirements/xai.lock.
xai = [
  "captum==0.9.0",
  "scipy==1.13.1",
]
# Test/lint tooling. CI installs this extra; it deliberately excludes the XAI
# extras so the suite keeps proving that core inference stands alone.
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["itg_nn", "itg_nn.xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/xai imports the thin CLIs in scripts/, which are not part of the
# installed package. Keep them importable however pytest is invoked.
pythonpath = ["."]

[tool.ruff]
line-length = 88
