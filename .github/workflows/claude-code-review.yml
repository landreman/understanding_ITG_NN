name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The reviewer needs a working environment so it can run pytest, apply a
      # mutation check, and recompute reported numbers on the committed review
      # slice. The external HDF5 dataset is deliberately absent.
      #
      # This environment is deliberately RICHER than ci.yml's. ci.yml installs
      # ".[dev]" only, and that is what keeps proving core inference and the
      # whole suite stand alone without the XAI extras — do not add anything
      # here to ci.yml to make the two match.
      #
      #   .[xai] (captum) — without it, code that calls Captum falls back to an
      #   in-repo estimator, so the reviewer silently checks a path production
      #   never took. With it, the reviewer exercises the registered path.
      #
      #   scipy — an implementation of rank correlation, regression, and
      #   distribution tails that this repository does not itself depend on, so
      #   a recomputation with it is independent of the code under review.
      #
      #   pandas — joins and group-bys over the committed artifact CSVs.
      - name: Install review verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,xai]"
          python -m pip install scipy pandas

      # A silent captum import failure would send the reviewer down the fallback
      # path while it believed it was checking production. Fail loudly instead.
      - name: Verify the review environment
        run: |
          python -c "import captum, scipy, pandas, torch, h5py; print('captum', captum.__version__)"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .claude/commands/review-step.md and perform its adversarial
            step review against this pull request. Use the checked-out PR code
            and its base branch as the review target.

            The external HDF5 dataset registered in PLAN.md is not available on
            this runner and .venv-xai does not exist here. Do not try to create
            them. You do have tests/data/review_slice.h5: 2,000 real rows
            covering the whole S01 interpretation panel plus sibling flux tubes.
            Recompute the PR's headline numbers on it where they concern panel
            rows, loading it through itg_nn.xai.review_slice so that a row ID
            outside the slice raises instead of silently reading a different
            flux tube. Do not edit or regenerate the slice.

            captum, scipy and pandas ARE installed here, so an attribution path
            that calls Captum runs its real implementation rather than an
            in-repo fallback, and you can cross-check a reported statistic with
            an implementation this repository does not depend on. If a captum
            code path still takes a fallback branch, that is a finding.

            The registered run's manifest.json is committed at
            reports/xai/SNN_artifacts/manifest.json. Check it there for
            completeness and for the checkpoint and dataset fingerprints; the
            git-ignored output/xai/ run directory is not on this runner.

            Post a top-level GitHub PR comment containing the required findings
            table and the final verdict line, even when there are no findings.
            Add inline comments only for confirmed code-specific findings.
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git cat-file:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(make*),Bash(pytest*),Bash(python*),mcp__github_inline_comment__create_inline_comment"
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
