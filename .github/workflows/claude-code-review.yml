name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The reviewer needs a working environment so it can run pytest and apply a
      # mutation check. The external HDF5 dataset is deliberately absent.
      - name: Install review verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .claude/commands/review-step.md and perform its adversarial
            step review against this pull request. Use the checked-out PR code
            and its base branch as the review target.

            The external HDF5 dataset registered in PLAN.md is not available on
            this runner and .venv-xai does not exist here. Do not try to create
            them. Verify claims against committed artifacts, manifests, and the
            pytest suite, which runs on synthetic fixtures and the committed
            checkpoint.

            Post a top-level GitHub PR comment containing the required findings
            table and the final verdict line, even when there are no findings.
            Add inline comments only for confirmed code-specific findings.
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(make*),Bash(pytest*),Bash(python*),mcp__github_inline_comment__create_inline_comment"
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
